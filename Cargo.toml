[package]
name = "serve"
version = "1.0.0"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"
mime_guess = "2"
chrono = "0.4"
colored = "2"
percent-encoding = "2"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
dirs = "5"
